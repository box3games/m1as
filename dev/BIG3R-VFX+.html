<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>BIG3R Transparent .webm VFX Asset Generator</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #1e293b;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    select,
    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #475569;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    select {
      background: #0f172a;
      color: #f8fafc;
    }

    button.primary {
      background: #10b981;
      color: #052e16;
      border-color: #10b981;
    }

    button.secondary {
      background: #334155;
      color: #f8fafc;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #334155;
      background-color: #1e1e1e;
      background-image:
        linear-gradient(45deg, #2b2b2b 25%, transparent 25%),
        linear-gradient(-45deg, #2b2b2b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2b2b2b 75%),
        linear-gradient(-45deg, transparent 75%, #2b2b2b 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    canvas {
      display: block;
      width: 512px;
      height: 512px;
      background: transparent;
    }

    #status {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <h2>BIG3R Transparent .webm VFX Generator</h2>

  <div class="controls">
    <select id="preset"></select>
    <button id="previewBtn" class="secondary">Preview Effect</button>
    <button id="recordBtn" class="primary">Record &amp; Download .webm</button>
  </div>

  <div class="stage">
    <canvas id="vfxCanvas" width="512" height="512"></canvas>
  </div>

  <div id="status">Ready. Checkerboard pattern indicates true alpha transparency.</div>

  <script>
    const canvas = document.getElementById("vfxCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });
    const presetSelect = document.getElementById("preset");
    const previewBtn = document.getElementById("previewBtn");
    const recordBtn = document.getElementById("recordBtn");
    const statusEl = document.getElementById("status");

    const WIDTH = 512;
    const HEIGHT = 512;
    const CX = WIDTH / 2;
    const CY = HEIGHT / 2;

    const VFX_REGISTRY = {};
    let animFrameId = null;

    window.registerVFXProp = function (propConfig) {
      VFX_REGISTRY[propConfig.id] = propConfig;
      const opt = document.createElement("option");
      opt.value = propConfig.id;
      opt.textContent = `${propConfig.label} (${(propConfig.durationMs / 1000).toFixed(1)}s)`;
      presetSelect.appendChild(opt);
      presetSelect.value = propConfig.id;
    };

    function playAnimation(onComplete) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const prop = VFX_REGISTRY[presetSelect.value];
      if (!prop) return;

      const state = prop.spawn ? prop.spawn(WIDTH, HEIGHT, CX, CY) : {};
      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const progress = Math.min(1, elapsed / prop.durationMs);
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        prop.render(ctx, progress, state, WIDTH, HEIGHT, CX, CY);

        if (progress < 1) {
          animFrameId = requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, WIDTH, HEIGHT);
          if (onComplete) onComplete();
        }
      }
      animFrameId = requestAnimationFrame(tick);
    }

    previewBtn.addEventListener("click", () => {
      statusEl.textContent = "Previewing transparent VFX animation...";
      playAnimation(() => {
        statusEl.textContent = "Preview complete.";
      });
    });

    recordBtn.addEventListener("click", () => {
      const preset = presetSelect.value;
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 4000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `m1as-vfx-${preset}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        previewBtn.disabled = false;
        recordBtn.disabled = false;
        statusEl.textContent = `Downloaded m1as-vfx-${preset}.webm (${(blob.size / 1024).toFixed(1)} KB) with alpha channel.`;
      };

      previewBtn.disabled = true;
      recordBtn.disabled = true;
      statusEl.textContent = `Recording ${mimeType} at 60 FPS...`;

      recorder.start();
      playAnimation(() => {
        setTimeout(() => recorder.stop(), 80);
      });
    });
  </script>

  <script>
    const purpleMagicSmoke = function spawnMagicSmoke() {
      window.registerVFXProp({
        id: "purple-magic-smoke",
        label: "VFX: Purple Magic Smoke",
        durationMs: 2000,

        spawn(W, H, CX, CY) {
          const puffs = [];
          const motes = [];

          for (let i = 0; i < 42; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 65;
            puffs.push({
              x: CX + Math.cos(angle) * dist,
              y: CY + 40 + Math.sin(angle) * (dist * 0.6),
              vx: (Math.random() - 0.5) * 1.4,
              vy: -0.8 - Math.random() * 1.8,
              radius: 36 + Math.random() * 44,
              grow: 24 + Math.random() * 28,
              hue: 268 + (Math.random() - 0.5) * 28,
              delay: Math.random() * 0.25,
              life: 0.65 + Math.random() * 0.35
            });
          }

          for (let i = 0; i < 30; i++) {
            motes.push({
              x: CX + (Math.random() - 0.5) * 180,
              y: CY + 60 + (Math.random() - 0.5) * 90,
              vx: (Math.random() - 0.5) * 0.9,
              vy: -1.5 - Math.random() * 2.5,
              size: 2 + Math.random() * 3.5,
              phase: Math.random() * Math.PI * 2
            });
          }

          return { puffs, motes };
        },

        render(ctx, progress, state, W, H, CX, CY) {
          const glowEnv = Math.sin(Math.min(1, progress * 1.15) * Math.PI);
          if (glowEnv > 0) {
            const coreGrad = ctx.createRadialGradient(CX, CY + 20, 10, CX, CY + 20, 175);
            coreGrad.addColorStop(0, `rgba(192, 132, 252, ${glowEnv * 0.45})`);
            coreGrad.addColorStop(0.55, `rgba(126, 34, 206, ${glowEnv * 0.25})`);
            coreGrad.addColorStop(1, "rgba(88, 28, 135, 0)");
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(CX, CY + 20, 175, 0, Math.PI * 2);
            ctx.fill();
          }

          for (const p of state.puffs) {
            const localP = (progress - p.delay) / p.life;
            if (localP <= 0 || localP >= 1) continue;

            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.985;

            const alpha = Math.sin(localP * Math.PI) * 0.42;
            const r = p.radius + localP * p.grow;

            const grad = ctx.createRadialGradient(p.x, p.y, r * 0.1, p.x, p.y, r);
            grad.addColorStop(0, `hsla(${p.hue}, 82%, 58%, ${alpha})`);
            grad.addColorStop(0.55, `hsla(${p.hue - 10}, 75%, 36%, ${alpha * 0.65})`);
            grad.addColorStop(1, `hsla(${p.hue - 15}, 70%, 20%, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
          }

          for (const m of state.motes) {
            m.x += m.vx + Math.sin(progress * 10 + m.phase) * 0.6;
            m.y += m.vy;
            const mAlpha = Math.sin(progress * Math.PI) * 0.9;
            if (mAlpha <= 0) continue;

            ctx.save();
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(243, 232, 255, ${mAlpha})`;
            ctx.shadowColor = "#c084fc";
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
          }
        }
      });
    };
    purpleMagicSmoke();
  </script>

  <script>
    const midpointLightning = function spawnMidpointLightning() {
      function generateBolt(x1, y1, x2, y2, displace, minDisplace) {
        if (displace < minDisplace) {
          return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
        }
        const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
        const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;
        const left = generateBolt(x1, y1, midX, midY, displace * 0.55, minDisplace);
        const right = generateBolt(midX, midY, x2, y2, displace * 0.55, minDisplace);
        return left.slice(0, -1).concat(right);
      }

      function drawBoltPath(ctx, points, width, color, blur, alpha) {
        if (points.length < 2) return;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "#38bdf8";
        ctx.shadowBlur = blur;
        ctx.stroke();
        ctx.restore();
      }

      window.registerVFXProp({
        id: "midpoint-lightning",
        label: "VFX: Midpoint Lightning",
        durationMs: 2000,

        spawn(W, H, CX, CY) {
          const sparks = [];
          for (let i = 0; i < 45; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 5.5;
            sparks.push({
              x: CX + (Math.random() - 0.5) * 60,
              y: CY + (Math.random() - 0.5) * 140,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 1.5 + Math.random() * 2.5,
              life: 0.4 + Math.random() * 0.6
            });
          }
          return {
            sparks,
            lastStrikeStep: -1,
            activeBolts: [],
            flashAlpha: 0
          };
        },

        render(ctx, progress, state, W, H, CX, CY) {
          // Envelope fades in fast and tapers off smoothly at the end
          const envelope = progress < 0.1
            ? progress / 0.1
            : progress > 0.8
              ? (1 - progress) / 0.2
              : 1;

          // Regenerate midpoint bolts ~24 times per second for crisp electric jitter
          const step = Math.floor(progress * 48);
          if (step !== state.lastStrikeStep) {
            state.lastStrikeStep = step;
            state.activeBolts = [];
            state.flashAlpha = 0.35 + Math.random() * 0.45;

            const strikeCount = Math.random() > 0.35 ? 2 : 1;
            for (let b = 0; b < strikeCount; b++) {
              const startX = CX + (Math.random() - 0.5) * 160;
              const startY = 48 + Math.random() * 40;
              const endX = CX + (Math.random() - 0.5) * 160;
              const endY = H - 48 - Math.random() * 40;

              const mainBolt = generateBolt(startX, startY, endX, endY, 110, 6);
              state.activeBolts.push({ points: mainBolt, isBranch: false });

              // Add 1-2 smaller offshoot branches from mid-points
              const branchCount = 1 + Math.floor(Math.random() * 2);
              for (let br = 0; br < branchCount; br++) {
                const idx = Math.floor(mainBolt.length * (0.25 + Math.random() * 0.5));
                const origin = mainBolt[idx];
                if (origin) {
                  const bEndX = origin.x + (Math.random() - 0.5) * 150;
                  const bEndY = origin.y + 40 + Math.random() * 110;
                  const branchBolt = generateBolt(origin.x, origin.y, bEndX, bEndY, 55, 6);
                  state.activeBolts.push({ points: branchBolt, isBranch: true });
                }
              }
            }
          }

          // 1. Ambient electric discharge glow
          const glowAlpha = state.flashAlpha * envelope * 0.45;
          const bgGrad = ctx.createRadialGradient(CX, CY, 15, CX, CY, 210);
          bgGrad.addColorStop(0, `rgba(125, 211, 252, ${glowAlpha})`);
          bgGrad.addColorStop(0.55, `rgba(14, 165, 233, ${glowAlpha * 0.45})`);
          bgGrad.addColorStop(1, "rgba(2, 132, 199, 0)");
          ctx.fillStyle = bgGrad;
          ctx.beginPath();
          ctx.arc(CX, CY, 210, 0, Math.PI * 2);
          ctx.fill();

          // 2. Render outer plasma aura + inner white-hot core for each midpoint bolt
          for (const bolt of state.activeBolts) {
            const outerW = bolt.isBranch ? 4.5 : 8.5;
            const innerW = bolt.isBranch ? 1.5 : 3.0;
            const alpha = (bolt.isBranch ? 0.75 : 1.0) * envelope;

            drawBoltPath(ctx, bolt.points, outerW, "#0ea5e9", 22, alpha * 0.75);
            drawBoltPath(ctx, bolt.points, innerW, "#f0f9ff", 10, alpha);
          }

          // 3. Electric spark particles
          for (const s of state.sparks) {
            s.x += s.vx;
            s.y += s.vy;
            s.vx *= 0.96;
            s.vy *= 0.96;

            // Respawn spark near center if it fades early
            if (Math.random() < 0.04 && progress < 0.75) {
              s.x = CX + (Math.random() - 0.5) * 90;
              s.y = CY + (Math.random() - 0.5) * 180;
              const a = Math.random() * Math.PI * 2;
              const spd = 2 + Math.random() * 5;
              s.vx = Math.cos(a) * spd;
              s.vy = Math.sin(a) * spd;
            }

            const sAlpha = envelope * 0.9;
            if (sAlpha <= 0) continue;

            ctx.save();
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(224, 242, 254, ${sAlpha})`;
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
          }
        }
      });
    };
    midpointLightning();
  </script>

  <script>
    const metaballFluid2D = function spawnMetaballFluid2D() {
      const GRID = 128;
      const offCanvas = document.createElement("canvas");
      offCanvas.width = GRID;
      offCanvas.height = GRID;
      const offCtx = offCanvas.getContext("2d");
      const imgData = offCtx.createImageData(GRID, GRID);

      window.registerVFXProp({
        id: "metaball-fluid-2d",
        label: "VFX: 2D Metaball Fluid",
        durationMs: 2000,

        spawn(W, H, CX, CY) {
          const blobs = [];
          const count = 11;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
            blobs.push({
              baseAngle: angle,
              orbitRadius: i === 0 ? 0 : 12 + Math.random() * 26,
              speed: (i % 2 === 0 ? 1 : -1) * (1.8 + Math.random() * 1.6),
              radius: i === 0 ? 22 : 11 + Math.random() * 9,
              phase: Math.random() * Math.PI * 2,
              x: GRID / 2,
              y: GRID / 2,
              r: 14
            });
          }
          return { blobs };
        },

        render(ctx, progress, state, W, H, CX, CY) {
          // Envelope scales blobs from 0 -> full organic motion -> 0 for clean start/end
          const envelope = Math.sin(progress * Math.PI);
          const scaleEnv = Math.pow(envelope, 0.55);
          const spreadEnv = Math.sin(progress * Math.PI * 0.85);

          const gCenter = GRID / 2;
          const activeBlobs = [];

          for (let i = 0; i < state.blobs.length; i++) {
            const b = state.blobs[i];
            const theta = b.baseAngle + progress * Math.PI * 2 * b.speed;
            const pulse = 1 + Math.sin(progress * Math.PI * 4 + b.phase) * 0.18;
            const dist = b.orbitRadius * spreadEnv * (1 + Math.sin(progress * Math.PI * 3 + i) * 0.25);

            const bx = gCenter + Math.cos(theta) * dist;
            const by = gCenter + Math.sin(theta) * dist;
            const br = b.radius * scaleEnv * pulse;

            if (br > 0.5) {
              activeBlobs.push({ x: bx, y: by, r2: br * br });
            }
          }

          const data = imgData.data;
          data.fill(0);

          if (activeBlobs.length > 0) {
            for (let y = 0; y < GRID; y++) {
              for (let x = 0; x < GRID; x++) {
                let sum = 0;
                for (let k = 0; k < activeBlobs.length; k++) {
                  const bl = activeBlobs[k];
                  const dx = x - bl.x;
                  const dy = y - bl.y;
                  const d2 = dx * dx + dy * dy + 0.001;
                  sum += bl.r2 / d2;
                }

                // Threshold at 1.0 creates crisp liquid surface tension & merging bridges
                if (sum >= 1.0) {
                  const idx = (y * GRID + x) * 4;
                  // Core shading transitions from deep cyan-teal edge to bright aqua-white center
                  const intensity = Math.min(1, (sum - 1.0) / 1.6);

                  const r = Math.round(14 + intensity * 195);
                  const g = Math.round(165 + intensity * 88);
                  const b = Math.round(233 + intensity * 22);

                  // Anti-aliased edge feathering right near threshold 1.0 - 1.18
                  const edgeAlpha = Math.min(1, (sum - 1.0) / 0.18);
                  const alpha = Math.round(edgeAlpha * Math.min(1, envelope * 1.4) * 245);

                  data[idx] = r;
                  data[idx + 1] = g;
                  data[idx + 2] = b;
                  data[idx + 3] = alpha;
                }
              }
            }
          }

          offCtx.putImageData(imgData, 0, 0);

          // Draw scaled smoothed metaball layer onto main 512x512 alpha canvas
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.shadowColor = "rgba(56, 189, 248, 0.55)";
          ctx.shadowBlur = 16;
          ctx.drawImage(offCanvas, 0, 0, W, H);
          ctx.restore();
        }
      });
    };
    metaballFluid2D();
  </script>

  <script>
    const greyGooJellyPour = function spawngreyGooJellyPour() {
      window.registerVFXProp({
        id: "grey-goo-jelly-pour",
        label: "VFX: Grey Goo / Jelly Pour",
        durationMs: 2000,

        spawn(W, H, CX, CY) {
          const droplets = [];
          const bubbles = [];
          const streamBubbles = [];

          for (let i = 0; i < 18; i++) {
            droplets.push({
              offsetX: (Math.random() - 0.5) * 38,
              delay: 0.08 + Math.random() * 0.45,
              speed: 0.75 + Math.random() * 0.55,
              radius: 5 + Math.random() * 9,
              stretch: 1.6 + Math.random() * 1.4
            });
          }

          for (let i = 0; i < 14; i++) {
            bubbles.push({
              x: CX + (Math.random() - 0.5) * 180,
              y: CY + 115 + (Math.random() - 0.5) * 32,
              r: 9.5 + Math.random() * 6,
              phase: Math.random() * Math.PI * 2,
              appearAt: 0.25 + Math.random() * 0.35
            });
          }

          const totalStreamBubbles = 140;
          for (let i = 0; i < totalStreamBubbles; i++) {
            streamBubbles.push({
              t: (i + Math.random() * 0.5) / totalStreamBubbles,
              offsetRatio: (Math.random() - 0.5) * 1.45,
              r: 1.5 + Math.random() * 4.5,
              flowSpeed: 0.5 + Math.random() * 0.5,
              phase: Math.random() * Math.PI * 2
            });
          }

          return { droplets, bubbles, streamBubbles };
        },

        render(ctx, progress, state, W, H, CX, CY) {
          // Overall fade-out at the very end so the clip finishes cleanly
          const endFade = progress > 0.82 ? Math.max(0, (1 - progress) / 0.18) : 1;
          if (endFade <= 0) return;

          ctx.save();
          ctx.globalAlpha = endFade;

          const puddleY = CY + 125;

          // Pour stream starts immediately, peaks mid-clip, and pinches off around 0.68
          const pourStart = Math.min(1, progress / 0.22);
          const pourPinch = progress > 0.48 ? Math.max(0, 1 - (progress - 0.48) / 0.24) : 1;
          const streamTopY = progress > 0.48 ? ((progress - 0.48) / 0.24) * puddleY : 0;
          const streamBotY = pourStart * puddleY;

          // 1. Main viscous pouring column with organic wave wobble
          if (pourPinch > 0 && streamBotY > streamTopY) {
            const segments = 24;
            const leftPts = [];
            const rightPts = [];

            for (let i = 0; i <= segments; i++) {
              const t = i / segments;
              const y = streamTopY + (streamBotY - streamTopY) * t;
              const pinchTaper = Math.sin(t * Math.PI);
              const baseHalfW = (14 + pinchTaper * 12) * pourPinch;
              const wobble =
                Math.sin(t * 10 - progress * 22) * 5 * pourPinch +
                Math.cos(t * 6 + progress * 14) * 3;

              leftPts.push({ x: CX - baseHalfW + wobble, y });
              rightPts.push({ x: CX + baseHalfW + wobble, y });
            }

            const streamGrad = ctx.createLinearGradient(CX - 25, 0, CX + 25, 0);
            streamGrad.addColorStop(0, "rgba(160, 160, 160, 0.25)");   // Sheer grey edge
            streamGrad.addColorStop(0.35, "rgba(220, 220, 220, 0.45)"); // Translucent light grey
            streamGrad.addColorStop(0.65, "rgba(255, 255, 255, 0.65)"); // Translucent milky white
            streamGrad.addColorStop(1, "rgba(130, 130, 130, 0.20)");    // Faint dissipating tail

            ctx.beginPath();
            ctx.moveTo(leftPts[0].x, leftPts[0].y);
            for (let i = 1; i < leftPts.length; i++) {
              ctx.lineTo(leftPts[i].x, leftPts[i].y);
            }
            // Rounded bulbous tip at bottom of stream
            ctx.quadraticCurveTo(CX, streamBotY + 18 * pourPinch, rightPts[rightPts.length - 1].x, rightPts[rightPts.length - 1].y);
            for (let i = rightPts.length - 2; i >= 0; i--) {
              ctx.lineTo(rightPts[i].x, rightPts[i].y);
            }
            ctx.closePath();

            ctx.fillStyle = streamGrad;
            ctx.shadowColor = "rgba(180, 180, 180, 0.35)";
            ctx.shadowBlur = 14;
            ctx.fill();

            // Glossy specular highlight strip along the stream
            ctx.beginPath();
            for (let i = 0; i < leftPts.length; i++) {
              const hx = leftPts[i].x + (rightPts[i].x - leftPts[i].x) * 0.32;
              if (i === 0) ctx.moveTo(hx, leftPts[i].y);
              else ctx.lineTo(hx, leftPts[i].y);

  <script>
    const spinningM1Coin = function spawnSpinningM1Coin() {
      window.registerVFXProp({
        id: "spinning-m1-coin",
        label: "VFX: Spinning M1 Coin",
        durationMs: 2000,

        spawn(W, H, CX, CY) {
          const sparkles = [];
          for (let i = 0; i < 16; i++) {
            sparkles.push({
              angle: (i / 16) * Math.PI * 2,
              dist: 118 + Math.random() * 38,
              size: 3 + Math.random() * 5,
              phase: Math.random() * Math.PI * 2,
              speed: 0.8 + Math.random() * 0.8
            });
          }
          return { sparkles };
        },

        render(ctx, progress, state, W, H, CX, CY) {
          // Smooth pop-in and pop-out envelope with slight upward bob
          const scaleEnv =
            progress < 0.12
              ? 1 - Math.pow(1 - progress / 0.12, 3)
              : progress > 0.88
                ? Math.max(0, (1 - progress) / 0.12)
                : 1;

          if (scaleEnv <= 0.001) return;

          const bobY = Math.sin(progress * Math.PI * 2) * 10;
          // 3 full 360-degree spins over 2.0 seconds
          const angle = progress * Math.PI * 6;
          const cosA = Math.cos(angle);
          const sinA = Math.sin(angle);

          const R = 104 * scaleEnv;
          const thickness = 18 * scaleEnv;
          const halfThick = (thickness * Math.abs(sinA)) / 2;
          const faceScaleX = Math.max(0.02, Math.abs(cosA));
          const offsetDirection = sinA >= 0 ? 1 : -1;

          ctx.save();
          ctx.translate(CX, CY + bobY);

          // 1. Soft golden aura behind coin
          const auraGrad = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.55);
          auraGrad.addColorStop(0, `rgba(253, 224, 71, ${0.35 * scaleEnv})`);
          auraGrad.addColorStop(0.6, `rgba(245, 158, 11, ${0.15 * scaleEnv})`);
          auraGrad.addColorStop(1, "rgba(217, 119, 6, 0)");
          ctx.fillStyle = auraGrad;
          ctx.beginPath();
          ctx.arc(0, 0, R * 1.55, 0, Math.PI * 2);
          ctx.fill();

          // 2. Extruded 3D metallic coin rim / cylinder edge
          const edgeSteps = 14;
          for (let s = -edgeSteps / 2; s <= edgeSteps / 2; s++) {
            const t = s / (edgeSteps / 2);
            const shiftX = t * halfThick * offsetDirection;

            ctx.save();
            ctx.translate(shiftX, 0);
            ctx.scale(faceScaleX, 1);
            ctx.beginPath();
            ctx.arc(0, 0, R, 0, Math.PI * 2);
            ctx.fillStyle = s % 2 === 0 ? "#b45309" : "#d97706";
            ctx.fill();
            ctx.restore();
          }

          // 3. Front-facing coin disc
          const frontX = halfThick * offsetDirection;
          ctx.save();
          ctx.translate(frontX, 0);
          ctx.scale(faceScaleX, 1);

          // Outer gold rim gradient
          const rimGrad = ctx.createLinearGradient(-R, -R, R, R);
          rimGrad.addColorStop(0, "#fef08a");
          rimGrad.addColorStop(0.35, "#f59e0b");
          rimGrad.addColorStop(0.7, "#b45309");
          rimGrad.addColorStop(1, "#fde047");

          ctx.beginPath();
          ctx.arc(0, 0, R, 0, Math.PI * 2);
          ctx.fillStyle = rimGrad;
          ctx.fill();

          // Recessed inner coin face
          const innerR = R * 0.84;
          const faceGrad = ctx.createLinearGradient(-innerR, -innerR, innerR, innerR);
          const sheenShift = (sinA + 1) * 0.5;
          const coinText = "BIG3R"
          faceGrad.addColorStop(0, "#d97706");
          faceGrad.addColorStop(Math.max(0.05, Math.min(0.95, sheenShift)), "#fef9c3");
          faceGrad.addColorStop(1, "#b45309");

          ctx.beginPath();
          ctx.arc(0, 0, innerR, 0, Math.PI * 2);
          ctx.fillStyle = faceGrad;
          ctx.fill();

          // Inner bevel ring
          ctx.lineWidth = 3 * scaleEnv;
          ctx.strokeStyle = "#78350f";
          ctx.stroke();

          // Dashed milled inner border detail
          ctx.save();
          ctx.setLineDash([5 * scaleEnv, 5 * scaleEnv]);
          ctx.lineWidth = 2.5 * scaleEnv;
          ctx.strokeStyle = "rgba(254, 240, 138, 0.75)";
          ctx.beginPath();
          ctx.arc(0, 0, innerR * 0.9, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          // Embossed "M1" emblem centered on face
          ctx.font = `900 ${Math.round(74 * scaleEnv)}px system-ui, -apple-system, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          // Dark recessed shadow
          ctx.fillStyle = "#78350f";
          ctx.fillText(`${coinText}`, 3 * scaleEnv, 5 * scaleEnv);

          // Bright raised gold highlight
          ctx.fillStyle = "#fef9c3";
          ctx.fillText(`${coinText}`, -1 * scaleEnv, 1 * scaleEnv);

          // Main gold fill
          ctx.fillStyle = "#f59e0b";
          ctx.fillText(`${coinText}`, 1 * scaleEnv, 3 * scaleEnv);

          ctx.restore();

          // 4. Orbiting 4-point star glints
          for (const sp of state.sparkles) {
            const twinkle = Math.max(0, Math.sin(progress * Math.PI * 6 * sp.speed + sp.phase));
            if (twinkle <= 0.1) continue;

            const a = sp.angle + progress * 1.4;
            const sx = Math.cos(a) * sp.dist * scaleEnv;
            const sy = Math.sin(a) * sp.dist * scaleEnv;
            const sr = sp.size * twinkle * scaleEnv;

            ctx.save();
            ctx.translate(sx, sy);
            ctx.fillStyle = `rgba(254, 249, 195, ${twinkle})`;
            ctx.shadowColor = "#facc15";
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, -sr * 1.8);
            ctx.quadraticCurveTo(0, 0, sr * 1.8, 0);
            ctx.quadraticCurveTo(0, 0, 0, sr * 1.8);
            ctx.quadraticCurveTo(0, 0, -sr * 1.8, 0);
            ctx.quadraticCurveTo(0, 0, 0, -sr * 1.8);
            ctx.fill();
            ctx.restore();
          }

          ctx.restore();
        }
      });
    };
    spinningM1Coin();
  </script>

  <script>
    const arcanePortal = function spawnArcanePortal() {
      window.registerVFXProp({
        id: "arcane-portal",
        label: "VFX: Magic / Arcane Portal",
        durationMs: 2000,

        spawn(W, H, CX, CY) {
          const motes = [];
          for (let i = 0; i < 48; i++) {
            motes.push({
              angle: Math.random() * Math.PI * 2,
              startDist: 130 + Math.random() * 95,

              hue: Math.random() > 0.45 ? 275 : 190,
              phase: Math.random()
            });
          }

          const rings = [];
          for (let i = 0; i < 6; i++) {
            rings.push({
              baseRadius: 34 + i * 24,
              speed: (i % 2 === 0 ? 1 : -1) * (1.8 + i * 0.45),
              segments: 3 + (i % 3),
              hue: i % 2 === 0 ? 272 : 192,
              width: 5.5 - i * 0.55
            });
          }

          return { motes, rings };
        },

        render(ctx, progress, state, W, H, CX, CY) {
          // Smooth portal open and collapse envelope
          const openEnv =
            progress < 0.16
              ? 1 - Math.pow(1 - progress / 0.16, 3)
              : progress > 0.82
                ? Math.max(0, (1 - progress) / 0.18)
                : 1;

          if (openEnv <= 0.001) return;

          ctx.save();
          ctx.translate(CX, CY);

          // 1. Deep dimensional vortex glow
          const maxR = 195 * openEnv;
          const vortexGrad = ctx.createRadialGradient(0, 0, 6 * openEnv, 0, 0, maxR);
          vortexGrad.addColorStop(0, `rgba(245, 243, 255, ${0.9 * openEnv})`);
          vortexGrad.addColorStop(0.22, `rgba(192, 132, 252, ${0.72 * openEnv})`);
          vortexGrad.addColorStop(0.55, `rgba(56, 189, 248, ${0.38 * openEnv})`);
          vortexGrad.addColorStop(0.85, `rgba(109, 40, 217, ${0.18 * openEnv})`);
          vortexGrad.addColorStop(1, "rgba(76, 29, 149, 0)");

          ctx.fillStyle = vortexGrad;
          ctx.beginPath();
          ctx.arc(0, 0, maxR, 0, Math.PI * 2);
          ctx.fill();

          // 2. Counter-rotating segmented arcane energy rings
          for (const ring of state.rings) {
            const r = ring.baseRadius * openEnv;
            const rot = progress * Math.PI * 2 * ring.speed;
            const arcSpan = (Math.PI * 2) / ring.segments;

            ctx.save();
            ctx.rotate(rot);
            ctx.strokeStyle = `hsla(${ring.hue}, 92%, 68%, ${0.82 * openEnv})`;
            ctx.shadowColor = `hsla(${ring.hue}, 95%, 60%, 0.9)`;
            ctx.shadowBlur = 14;
            ctx.lineWidth = Math.max(1.5, ring.width * openEnv);
            ctx.lineCap = "round";

            for (let s = 0; s < ring.segments; s++) {
              const startA = s * arcSpan + 0.18;
              const endA = (s + 1) * arcSpan - 0.18;
              ctx.beginPath();
              ctx.arc(0, 0, r, startA, endA);
              ctx.stroke();
            }
            ctx.restore();
          }

          // 3. Orbiting geometric rune ticks along outer perimeter
          const runeCount = 12;
          const runeOrbitR = 148 * openEnv;
          ctx.save();
          ctx.rotate(progress * Math.PI * 1.5);
          for (let i = 0; i < runeCount; i++) {
            const a = (i / runeCount) * Math.PI * 2;
            const rx = Math.cos(a) * runeOrbitR;
            const ry = Math.sin(a) * runeOrbitR;

            ctx.save();
            ctx.translate(rx, ry);
            ctx.rotate(a + Math.PI / 2);
            ctx.strokeStyle = `rgba(224, 242, 254, ${0.75 * openEnv})`;
            ctx.lineWidth = 2 * openEnv;
            ctx.strokeRect(-4 * openEnv, -6 * openEnv, 8 * openEnv, 12 * openEnv);
            ctx.restore();

          // 4. Inward-pulling energy motes spiraling into the portal core
          for (const m of state.motes) {

            const dist = m.startDist * (1 - cycle) * openEnv;
            const theta = m.angle + cycle * Math.PI * m.spin;
            const mx = Math.cos(theta) * dist;
            const my = Math.sin(theta) * dist;

            if (mAlpha <= 0.02) continue;

            ctx.save();
            ctx.beginPath();
            ctx.arc(mx, my, m.size * (1 - cycle * 0.4) * openEnv, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${m.hue}, 95%, 75%, ${mAlpha})`;
            ctx.shadowColor = `hsla(${m.hue}, 95%, 65%, ${mAlpha})`;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
          }

          // 5. Crisp white-violet singularity core
          const pulse = 1 + Math.sin(progress * Math.PI * 10) * 0.12;
          const coreR = 24 * openEnv * pulse;
          const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, coreR);
          coreGrad.addColorStop(0, `rgba(255, 255, 255, ${openEnv})`);
          coreGrad.addColorStop(0.55, `rgba(216, 180, 254, ${0.85 * openEnv})`);
          coreGrad.addColorStop(1, "rgba(147, 51, 234, 0)");

          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(0, 0, coreR, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      });
    };

  </script>

  <script>
    const empShockwave = function spawnEmpShockwave() {
      function generateArcPoints(x1, y1, x2, y2, displace, minDisplace) {
        if (displace < minDisplace) {
          return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
        }
        const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
        const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;
        const left = generateArcPoints(x1, y1, midX, midY, displace * 0.55, minDisplace);
        const right = generateArcPoints(midX, midY, x2, y2, displace * 0.55, minDisplace);
        return left.slice(0, -1).concat(right);
      }

      window.registerVFXProp({
        id: "emp-shockwave",
        label: "VFX: Electric / EMP Shockwave",
        durationMs: 1800,

        spawn(W, H, CX, CY) {

            lastArcStep: -1,
            radialArcs: []

        render(ctx, progress, state, W, H, CX, CY) {
          // 1. Sharp initial EMP flash
          const flashP = Math.min(1, progress / 0.28);
          if (flashP < 1) {
            const flashAlpha = Math.pow(1 - flashP, 2);
            const flashR = 30 + flashP * 210;
            const flashGrad = ctx.createRadialGradient(CX, CY, 4, CX, CY, flashR);
            flashGrad.addColorStop(0, `rgba(255, 255, 255, ${flashAlpha})`);
            flashGrad.addColorStop(0.35, `rgba(103, 232, 249, ${flashAlpha * 0.85})`);
            flashGrad.addColorStop(0.75, `rgba(6, 182, 212, ${flashAlpha * 0.35})`);

            ctx.fillStyle = flashGrad;
            ctx.beginPath();
            ctx.arc(CX, CY, flashR, 0, Math.PI * 2);
            ctx.fill();

          // 2. Expanding concentric EMP pressure waves

            { delay: 0.0, duration: 0.72, maxR: 230, width: 12, hue: 188 },
            { delay: 0.12, duration: 0.78, maxR: 215, width: 7, hue: 202 },
            { delay: 0.24, duration: 0.76, maxR: 185, width: 4, hue: 180 }
          ];

          for (const rc of ringConfigs) {
            const localP = (progress - rc.delay) / rc.duration;
            if (localP <= 0 || localP >= 1) continue;

            const ease = 1 - Math.pow(1 - localP, 3);
            const r = 16 + ease * rc.maxR;
            const alpha = (1 - localP) * 0.9;

            ctx.save();
            ctx.beginPath();
            ctx.arc(CX, CY, r, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(${rc.hue}, 95%, 68%, ${alpha})`;
            ctx.lineWidth = Math.max(1, rc.width * (1 - localP));
            ctx.shadowColor = "#22d3ee";
            ctx.shadowBlur = 18;
            ctx.stroke();
            ctx.restore();
          }

          // 3. Jagged radial lightning arcs snapping outward with the primary wave
          const waveP = Math.min(1, progress / 0.75);
          const waveRadius = 25 + (1 - Math.pow(1 - waveP, 2.6)) * 205;
          const arcAlpha = progress < 0.75 ? 1 - progress * 0.5 : Math.max(0, (1 - progress) / 0.25);

          const step = Math.floor(progress * 36);
          if (step !== state.lastArcStep && arcAlpha > 0) {

              const a = (i / boltCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.45;

              ctx.beginPath();
              ctx.moveTo(pts.x, pts.y);
              for (let i = 1; i < pts.length; i++) {

              ctx.lineWidth = 1.6;

            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
          }
        }
      });
    };

              const r = Math.max(0, baseR + radiusJitter);

              row.push({
                x: Math.cos(a) * r,

                a,
                r
              });

            grid.push(row);

          const rx = 0.06 + Math.min(0.14, hulkFactor * 0.06);
          const rz = 0;

          const frameScale = (0.92 + hulkFactor * 0.32) * popIn;
          const fov = 450;
          const cameraZ = 390;

          const worldVerts = [];
          const projVerts = [];

          for (const v of state.mesh.verts) {
            const radiusBoost = 1 + hulkFactor * v.bulgeWeight * 0.88;
            const stanceWidenX = 1 + hulkFactor * 0.24;
            const stanceDropY = Math.min(16, hulkFactor * 5.5);

            const raw = {
              x: (v.cx * stanceWidenX + v.dirX * v.baseR * radiusBoost) * frameScale,
              y: (v.cy + stanceDropY + v.dirY * v.baseR * radiusBoost) * frameScale,
              z: (v.cz + v.dirZ * v.baseR * radiusBoost) * frameScale
            };

            const rot = rotate3D(raw, rx, ry, rz);
            worldVerts.push(rot);
            projVerts.push(project3D(rot, CX, CY + 12, fov, cameraZ));
          }

          const groundY = Math.min(H - 18, CY + 132 * frameScale);
          const auraR = Math.max(20, (65 + hulkFactor * 85) * popIn);
          const auraIntensity = Math.min(0.85, 0.22 + hulkFactor * 0.32);

          const auraGrad = ctx.createRadialGradient(CX, groundY, 4, CX, groundY, auraR);
          auraGrad.addColorStop(0, "rgba(52, 211, 153, " + (auraIntensity * fadeOut) + ")");
          auraGrad.addColorStop(0.55, "rgba(16, 185, 129, " + (auraIntensity * 0.45 * fadeOut) + ")");
          auraGrad.addColorStop(1, "rgba(16, 185, 129, 0)");

          ctx.save();
          ctx.translate(CX, groundY);
          ctx.scale(1.5, 0.36);
          ctx.fillStyle = auraGrad;
          ctx.beginPath();
          ctx.arc(0, 0, auraR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (hulkFactor > 0.25) {
            const waveSpeed = 1.8 + hulkFactor * 1.4;
            for (let w = 0; w < 3; w++) {
              const localP = (progress * waveSpeed + w * 0.33) % 1;
              const ringRx = (40 + localP * (95 + hulkFactor * 65)) * popIn;
              const ringRy = ringRx * 0.26;
              const rAlpha = (1 - localP) * Math.min(0.75, hulkFactor * 0.42) * fadeOut;

              ctx.save();
              ctx.beginPath();
              ctx.ellipse(CX, groundY, ringRx, ringRy, 0, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(110, 231, 183, " + rAlpha + ")";
              ctx.lineWidth = (1.8 + hulkFactor * 1.4) * (1 - localP);
              ctx.stroke();
              ctx.restore();
            }
          }
          // Painter's Z-sorted 3D shaded muscle polygons (with explicit quad[0..3] indexing)
          const sortedFaces = state.mesh.faces
            .map((quad) => {
              const p0 = worldVerts[quad[0]];
              const p1 = worldVerts[quad[1]];
              const p2 = worldVerts[quad[2]];
              const p3 = worldVerts[quad[3]];
              const avgZ = (p0.z + p1.z + p2.z + p3.z) * 0.25;
              const ux = p1.x - p0.x, uy = p1.y - p0.y, uz = p1.z - p0.z;
              const vx = p2.x - p0.x, vy = p2.y - p0.y, vz = p2.z - p0.z;
              const nx = uy * vz - uz * vy;
              const ny = uz * vx - ux * vz;
              const nz = ux * vy - uy * vx;
              const nLen = Math.hypot(nx, ny, nz) || 1;
              const keyLight = Math.max(0, (-0.35 * nx - 0.55 * ny + 0.75 * nz) / nLen);
              const rimLight = Math.max(0, (0.65 * nx - 0.2 * ny - 0.3 * nz) / nLen);
              return { quad, avgZ, keyLight, rimLight, isFront: nz > 0 };
            })
            .sort((a, b) => a.avgZ - b.avgZ);
          for (const f of sortedFaces) {
            if (!f.isFront) continue;
            const pts = f.quad.map((idx) => projVerts[idx]);
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            ctx.lineTo(pts[1].x, pts[1].y);
            ctx.lineTo(pts[2].x, pts[2].y);
            ctx.lineTo(pts[3].x, pts[3].y);
            ctx.closePath();
            const energyShift = Math.min(1, hulkFactor / 1.8);
            const r = Math.min(255, Math.round(14 + f.keyLight * 75 + f.rimLight * 55 + energyShift * 45));
            const g = Math.min(255, Math.round(115 + f.keyLight * 125 + f.rimLight * 40 + energyShift * 20));
            const b = Math.min(255, Math.round(88 + f.keyLight * 95 + f.rimLight * 85 - energyShift * 25));
            ctx.fillStyle = "rgba(" + r + ", " + g + ", " + b + ", " + (0.9 * fadeOut) + ")";
            ctx.fill();
            ctx.lineWidth = 0.85;
            ctx.strokeStyle = "rgba(167, 243, 208, " + ((0.2 + f.keyLight * 0.35 + energyShift * 0.15) * fadeOut) + ")";
            ctx.stroke();
          }
          const activeSparkCount = Math.min(state.energySparks.length, Math.floor(10 + hulkFactor * 32));
          for (let i = 0; i < activeSparkCount; i++) {
            const sp = state.energySparks[i];
            sp.y += sp.vy * (0.7 + hulkFactor * 0.5);
            if (sp.y < -150) sp.y = 125;
            const rawS = {
              x: sp.x * (0.85 + hulkFactor * 0.28) + Math.sin(progress * 24 + sp.phase) * 9,
              y: sp.y,
              z: sp.z * (0.85 + hulkFactor * 0.28)
            };
            const rotS = rotate3D(rawS, rx, ry, rz);
            const projS = project3D(rotS, CX, CY + 12, fov, cameraZ);
            const sparkAlpha = Math.min(0.95, 0.35 + hulkFactor * 0.4) * fadeOut;
            const sparkColor = "hsla(" + sp.hue + ", 95%, 68%, " + sparkAlpha + ")";
            const glowColor = "hsla(" + sp.hue + ", 95%, 60%, " + sparkAlpha + ")";
            ctx.save();
            ctx.beginPath();
            ctx.arc(projS.x, projS.y, Math.max(0.6, sp.size * projS.scale * fadeOut), 0, Math.PI * 2);
            ctx.fillStyle = sparkColor;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
          }
        }
      });
    };
    big3rHulk3D();
  </script>
