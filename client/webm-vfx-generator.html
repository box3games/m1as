<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>M1AS Transparent .webm VFX Asset Generator</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #1e293b;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    select, button {
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #475569;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    select {
      background: #0f172a;
      color: #f8fafc;
    }
    button.primary {
      background: #10b981;
      color: #052e16;
      border-color: #10b981;
    }
    button.secondary {
      background: #334155;
      color: #f8fafc;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #334155;
      background-color: #1e1e1e;
      background-image:
        linear-gradient(45deg, #2b2b2b 25%, transparent 25%),
        linear-gradient(-45deg, #2b2b2b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2b2b2b 75%),
        linear-gradient(-45deg, transparent 75%, #2b2b2b 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }
    canvas {
      display: block;
      width: 512px;
      height: 512px;
      background: transparent;
    }
    #status {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h2>M1AS Transparent .webm VFX Generator</h2>

  <div class="controls">
    <select id="preset">
      <option value="growth">BIG3R: Growth Surge Burst (1.5s)</option>
      <option value="fireball">VFX: Fireball Explosion (1.5s)</option>
      <option value="collapse">BIG3R: Box Collapse Dust &amp; Shards (1.8s)</option>
    </select>
    <button id="previewBtn" class="secondary">Preview Effect</button>
    <button id="recordBtn" class="primary">Record &amp; Download .webm</button>
  </div>

  <div class="stage">
    <canvas id="vfxCanvas" width="512" height="512"></canvas>
  </div>

  <div id="status">Ready. Checkerboard pattern indicates true alpha transparency.</div>

  <script>
    const canvas = document.getElementById("vfxCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });
    const presetSelect = document.getElementById("preset");
    const previewBtn = document.getElementById("previewBtn");
    const recordBtn = document.getElementById("recordBtn");
    const statusEl = document.getElementById("status");

    const WIDTH = 512;
    const HEIGHT = 512;
    const CX = WIDTH / 2;
    const CY = HEIGHT / 2;

    let particles = [];
    let animFrameId = null;

    function spawnParticles(preset) {
      particles = [];
      if (preset === "growth") {
        for (let i = 0; i < 65; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = 20 + Math.random() * 110;
          particles.push({
            x: CX + Math.cos(angle) * radius,
            y: CY + 80 + (Math.random() - 0.5) * 80,
            vx: (Math.random() - 0.5) * 1.2,
            vy: -2.5 - Math.random() * 4.5,
            size: 3 + Math.random() * 6,
            hue: Math.random() > 0.35 ? 150 : 48,
            maxLife: 0.6 + Math.random() * 0.4
          });
        }
      } else if (preset === "fireball") {
        for (let i = 0; i < 90; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 9;
          particles.push({
            x: CX,
            y: CY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 8 + Math.random() * 18,
            hue: 10 + Math.random() * 38,
            maxLife: 0.5 + Math.random() * 0.5
          });
        }
      } else if (preset === "collapse") {
        for (let i = 0; i < 75; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 7;
          const isShard = i % 3 === 0;
          particles.push({
            x: CX + (Math.random() - 0.5) * 140,
            y: CY + (Math.random() - 0.5) * 140,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed + (isShard ? 1.5 : -0.5),
            size: isShard ? 6 + Math.random() * 10 : 22 + Math.random() * 32,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.25,
            isShard,
            maxLife: 0.7 + Math.random() * 0.3
          });
        }
      }
    }
    function renderFrame(preset, progress) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      if (preset === "growth") {
        for (let r = 0; r < 3; r++) {
          const localP = Math.max(0, Math.min(1, (progress - r * 0.15) / 0.7));
          if (localP > 0 && localP < 1) {
            const radius = 30 + localP * 190;
            const alpha = (1 - localP) * 0.85;
            ctx.save();
            ctx.beginPath();
            ctx.arc(CX, CY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(152, 90%, 60%, ${alpha})`;
            ctx.lineWidth = 8 * (1 - localP);
            ctx.shadowColor = "#10b981";
            ctx.shadowBlur = 18;
            ctx.stroke();
            ctx.restore();
          }
        }

        const coreAlpha = Math.sin(progress * Math.PI) * 0.65;
        const grad = ctx.createRadialGradient(CX, CY, 10, CX, CY, 180);
        grad.addColorStop(0, `rgba(167, 243, 208, ${coreAlpha})`);
        grad.addColorStop(0.5, `rgba(16, 185, 129, ${coreAlpha * 0.5})`);
        grad.addColorStop(1, "rgba(16, 185, 129, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          const pAlpha = Math.max(0, 1 - progress / p.maxLife);
          if (pAlpha <= 0) continue;
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (1 - progress * 0.4), 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${pAlpha})`;
          ctx.shadowColor = `hsla(${p.hue}, 95%, 65%, ${pAlpha})`;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.restore();
        }
      } else if (preset === "fireball") {
        const flashP = Math.min(1, progress / 0.45);
        if (flashP < 1) {
          const coreR = 20 + flashP * 170;
          const grad = ctx.createRadialGradient(CX, CY, 5, CX, CY, coreR);
          grad.addColorStop(0, `rgba(255, 255, 220, ${1 - flashP})`);
          grad.addColorStop(0.45, `rgba(255, 120, 20, ${(1 - flashP) * 0.9})`);
          grad.addColorStop(1, "rgba(220, 38, 38, 0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(CX, CY, coreR, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.95;
          p.vy *= 0.95;
          const pAlpha = Math.max(0, 1 - progress / p.maxLife);
          if (pAlpha <= 0) continue;
          const r = p.size * (1 + progress * 0.8);
          const grad = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, r);
          grad.addColorStop(0, `hsla(${p.hue + 15}, 100%, 70%, ${pAlpha})`);
          grad.addColorStop(0.6, `hsla(${p.hue}, 100%, 50%, ${pAlpha * 0.7})`);
          grad.addColorStop(1, "hsla(0, 90%, 30%, 0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (preset === "collapse") {
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          const pAlpha = Math.max(0, 1 - progress / p.maxLife);
          if (pAlpha <= 0) continue;

          if (p.isShard) {
            p.rot += p.vRot;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = `rgba(203, 213, 225, ${pAlpha})`;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
            ctx.restore();
          } else {
            const r = p.size * (1 + progress * 1.1);
            const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r);
            grad.addColorStop(0, `rgba(148, 163, 184, ${pAlpha * 0.55})`);
            grad.addColorStop(1, "rgba(100, 116, 139, 0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }

    function playAnimation(onComplete) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const preset = presetSelect.value;
      const durationMs = preset === "collapse" ? 1800 : 1500;
      spawnParticles(preset);
      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const progress = Math.min(1, elapsed / durationMs);
        renderFrame(preset, progress);
        if (progress < 1) {
          animFrameId = requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, WIDTH, HEIGHT);
          if (onComplete) onComplete();
        }
      }
      animFrameId = requestAnimationFrame(tick);
    }

    previewBtn.addEventListener("click", () => {
      statusEl.textContent = "Previewing transparent VFX animation...";
      playAnimation(() => {
        statusEl.textContent = "Preview complete.";
      });
    });

    recordBtn.addEventListener("click", () => {
      const preset = presetSelect.value;
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 4000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `m1as-vfx-${preset}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        previewBtn.disabled = false;
        recordBtn.disabled = false;
        statusEl.textContent = `Downloaded m1as-vfx-${preset}.webm (${(blob.size / 1024).toFixed(1)} KB) with alpha channel.`;
      };

      previewBtn.disabled = true;
      recordBtn.disabled = true;
      statusEl.textContent = `Recording ${mimeType} at 60 FPS...`;

      recorder.start();
      playAnimation(() => {
        setTimeout(() => recorder.stop(), 80);
      });
    });
  </script>
</body>
</html>
